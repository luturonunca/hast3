[merge_regions]
; Path to the first hull point file (e.g. from decontaminate or select).
region_a   = /path/to/runA/results_part

; Path to the second hull point file.
region_b   = /path/to/runB/results_part

; Base name for output files.
; Writes {fname}_part_merged (hull vertices) and {fname}_merged.pdf (plot).
fname      = merged

; Human-readable labels for each region in plots (default: "Halo A" / "Halo B").
label_a    = Halo A
label_b    = Halo B

; Produce diagnostic PDF (default true).
plot       = true

; --- optional: comparison plots from tracking caches ---
; If cache_a, cache_b and output_dir are all set, two extra pages are appended
; to the PDF: rotation curves side-by-side (page 2) and q/lambda vs lookback
; time with both halos overplotted (page 3).

; Tracking cache files written by decontaminate ({fname}_tracking_cache.pkl).
; cache_a    = /path/to/runA/results_tracking_cache.pkl
; cache_b    = /path/to/runB/results_tracking_cache.pkl

; Any output_????? folder from the simulation — used to read cosmological
; parameters (H0, omega_m, omega_l) needed for the lookback-time axis.
; Both runs must share the same cosmology (same box is typical).
; output_dir = /path/to/runA/outputs
